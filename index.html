<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Arduino Uno Blink Uploader</title>
  <script src="https://github.com/dbuezas/arduino-web-uploader/releases/download/v1.1.2/main.js"></script>
</head>
<body>
  <h1>Upload Blink to Arduino Uno R3</h1>
  <button
    arduino-uploader
    hex-href="blink.hex"
    board="uno"
  >
    Upload Blink
    <span class="upload-progress"></span>
  </button>
</body>
</html>
