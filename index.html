<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maker Nano Blink Uploader</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Arduino Web Uploader -->
  <script src="https://unpkg.com/arduino-web-uploader@1.1.2/dist/main.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans flex items-center justify-center min-h-screen">
  <div class="bg-white shadow-xl rounded-xl p-8 max-w-md text-center">
    <h1 class="text-2xl font-bold mb-4">🚀 Flash Blink to Maker Nano</h1>
    <p class="mb-6 text-gray-600">
      Connect your <strong>Maker Nano</strong> via USB and upload the <code>Blink</code> sketch directly from your browser.
    </p>
    <button
      class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition duration-200 ease-in-out"
      arduino-uploader
      hex-href="blink.hex"
      board="nano"
      use-web-serial
    >
      🔌 Upload Blink
      <span class="upload-progress ml-2 text-sm text-white font-normal"></span>
    </button>
    <p class="mt-4 text-sm text-gray-500">Browser must support Web Serial (Chrome or Edge).</p>
  </div>
</body>
</html>
